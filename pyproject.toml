[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta" 

[project]
name = "sme-ai-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "langchain==0.1.17",
    "langchain-groq",
    "langchain-community",
    "langchain-core",
    "chromadb",
    "sentence-transformers",
    "pandas",
    "python-dotenv",
    "torch",
    "transformers",
    "scikit-learn",
    "ollama",
]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
sme-ui  = "frontend.ui:main"
sme-cli = "run:main"